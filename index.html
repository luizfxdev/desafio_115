<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O Retorno das Strings</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="background"></div>
    <div class="container">
        <div class="content">
            <h1>O Retorno das Strings</h1>
            <p class="subtitle">Inverter a ordem das palavras, você deve.</p>

            <div class="input-group">
                <input type="text" id="frase" placeholder="Digite sua frase mágica...">
            </div>

            <div class="button-group">
                <button class="glow-on-hover" id="decifrar">Decifrar</button>
                <button class="glow-on-hover" id="retornar">Retornar</button>
            </div>

            <div class="resultado-container">
                <div id="resultado" class="resultado">Resultado aparecerá aqui...</div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
